name: Approved lab Terraform plan

on:
  workflow_dispatch:
    inputs:
      approved_cloud_read:
        description: Confirm separate Lead Architect approval for Azure/state reads and native state locking
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-lab-state
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && vars.WORKFLOW_PLAN_ENABLED == 'true' && inputs.approved_cloud_read && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    environment: lab-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.LAB_RESOURCE_GROUP_NAME }}
      TF_VAR_workspace_name: ${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}
      TF_VAR_daily_quota_gb: ${{ vars.LOG_ANALYTICS_DAILY_QUOTA_GB }}
      TF_VAR_tags: ${{ vars.LAB_TAGS_JSON }}
      STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
      ENVIRONMENT_PROTECTION_CONFIRMED: ${{ vars.ENVIRONMENT_PROTECTION_CONFIRMED }}
    steps:
      - name: Require approved environment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$ENVIRONMENT_PROTECTION_CONFIRMED" = "true" || { echo 'Configure and independently verify environment protections first.'; exit 1; }
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_resource_group_name TF_VAR_workspace_name TF_VAR_daily_quota_gb TF_VAR_tags STATE_STORAGE_ACCOUNT; do
            test -n "${!name}" || { echo "Missing required environment setting: $name"; exit 1; }
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - name: Authenticate the approved plan identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Plan lab with private ephemeral files and sanitized output
        working-directory: infra/environments/lab
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/plan-lab.sh"
        # Binary plan/review metadata go only to the existing private Azure
        # container. Never publish plan/state/log data as GitHub artifacts.

name: Read-only plan identity OIDC smoke

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed main commit containing this smoke workflow
        type: string
        required: true
      confirmation:
        description: Type READ_ONLY_PLAN_IDENTITY_SMOKE after Lead Architect approval
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && inputs.reviewed_commit == github.sha && inputs.confirmation == 'READ_ONLY_PLAN_IDENTITY_SMOKE'
    environment: lab-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      OIDC_SMOKE_CONTEXT: ${{ secrets.OIDC_SMOKE_CONTEXT }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      SMOKE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exchange the plan identity assertion and read only the approved lab group
        run: python3 .github/scripts/oidc-smoke.py
        # No Azure CLI login/cache, Terraform, backend, Blob or deploy identity.

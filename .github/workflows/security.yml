name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned scanners
        shell: bash
        run: |
          python -m pip install 'checkov==3.2.495'
          release='https://github.com/gitleaks/gitleaks/releases/download/v8.24.3'
          curl --fail --silent --show-error --location "$release/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          # Pinned from the v8.24.3 upstream release checksum manifest.
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/security-bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/security-bin" gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Workflow trust boundaries and private-plan negative fixtures
        run: python security/tests/test_workflow_security.py
      - name: Offline OIDC smoke claim and network-boundary regressions
        run: python security/tests/test_oidc_smoke.py
      - name: Offline plan and deploy identity boundary regressions
        run: python security/tests/test_oidc_access.py
      - name: Baseline and named negative security tests
        run: python security/tests/run_security_checks.py
